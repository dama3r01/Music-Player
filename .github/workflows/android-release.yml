name: Android Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v4

    - name: set up JDK 17
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Run tests
      run: ./gradlew testDebugUnitTest

    - name: Build Debug APK for Release
      run: ./gradlew assembleDebug

    - name: Get Version
      id: get_version
      run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_ENV

    - name: Rename APK
      run: mv app/build/outputs/apk/debug/app-debug.apk Music-Player-${{ env.VERSION }}.apk

    - name: Generate SHA-256 Checksum
      run: sha256sum Music-Player-${{ env.VERSION }}.apk > Music-Player-${{ env.VERSION }}.apk.sha256

    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        files: |
          Music-Player-*.apk
          Music-Player-*.apk.sha256
        generate_release_notes: true
